# Local development: PostgreSQL and Mailpit (a test inbox that catches
# every email the console sends). Run the app itself with `npm run dev`.
#
#   docker compose up -d
#   open http://localhost:8025 to read the emails
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: console
      POSTGRES_PASSWORD: console
      POSTGRES_DB: console
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U console -d console"]
      interval: 5s
      timeout: 5s
      retries: 10

  mail:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP: SMTP_URL=smtp://localhost:1025
      - "8025:8025" # Inbox in the browser

volumes:
  db-data:

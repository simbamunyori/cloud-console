# Apache in front of the public website (Milestone 10), installed by
# deploy/site-setup.sh as /etc/apache2/sites-available/site.conf. The same
# app as the console serves it and keeps sign-in and the consoles on
# console.fourthgeneration.technology. The bare domain is not served here:
# it stays on the mail and web server, which redirects it to www.
# certbot --apache copies this into an HTTPS site and turns this one into a
# redirect to HTTPS.
<VirtualHost *:80>
    ServerName www.fourthgeneration.technology

    ProxyRequests Off
    ProxyPreserveHost On
    # As for the console: the only X-Forwarded-For address is the one Apache adds.
    RequestHeader unset X-Forwarded-For early
    RequestHeader unset X-Real-IP early
    RequestHeader unset X-Forwarded-Host early
    RequestHeader set X-Forwarded-Proto "https" env=HTTPS

    ProxyPass        / http://127.0.0.1:3000/ timeout=120
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/site-error.log
    CustomLog ${APACHE_LOG_DIR}/site-access.log combined
</VirtualHost>

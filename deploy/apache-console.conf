# Apache in front of the console (installed by deploy/server-setup.sh as
# /etc/apache2/sites-available/console.conf). certbot --apache copies this
# into an HTTPS site and turns this one into a redirect to HTTPS.
<VirtualHost *:80>
    ServerName console.fourthgeneration.technology

    ProxyRequests Off
    ProxyPreserveHost On
    # The app trusts the first X-Forwarded-For address for the /admin
    # allowlist and rate limits. Drop whatever the visitor sent, so the only
    # address in it is the one Apache adds: the real client.
    RequestHeader unset X-Forwarded-For early
    RequestHeader unset X-Real-IP early
    RequestHeader unset X-Forwarded-Host early
    RequestHeader set X-Forwarded-Proto "https" env=HTTPS

    ProxyPass        / http://127.0.0.1:3000/ timeout=120
    ProxyPassReverse / http://127.0.0.1:3000/

    # Staff upload Azure usage files of up to 9 MB.
    LimitRequestBody 10485760

    ErrorLog ${APACHE_LOG_DIR}/console-error.log
    CustomLog ${APACHE_LOG_DIR}/console-access.log combined
</VirtualHost>

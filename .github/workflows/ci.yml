name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: console
          POSTGRES_PASSWORD: console
          POSTGRES_DB: console
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U console"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://console:console@localhost:5432/console
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        # Fails on any high or critical advisory in what ships to production.
        run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
      - name: Check migrations match the schema
        run: |
          PGPASSWORD=console psql -h localhost -U console -d console -c "CREATE DATABASE console_shadow"
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://console:console@localhost:5432/console_shadow --exit-code
      - run: npx prisma migrate deploy
      - name: Seed the demo data (twice, to prove it is safe to rerun)
        run: npm run db:seed && npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - name: Check UI copy (no em dashes, company name)
        run: npm run copy-check
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t cloud-console:ci .

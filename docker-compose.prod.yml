# Production: the app, PostgreSQL and the nightly backup.
#
# On the production server (Apache in front, see docs/deploy.md) this file is
# run by deploy/deploy.sh, never by hand:
#   docker compose -p console -f docker-compose.prod.yml ...
# The project name "console" keeps the database and media volumes the same
# from one release to the next.
#
# On a server without a web server of its own, add Caddy for automatic
# HTTPS with:  docker compose -p console -f docker-compose.prod.yml --profile caddy up -d
services:
  app:
    image: cloud-console:${RELEASE:-latest}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://console:${POSTGRES_PASSWORD}@db:5432/console
      NODE_ENV: production
      RELEASE: ${RELEASE:-latest}
    # Only Apache on this server reaches the app.
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      console:
        # A fixed address, so WHMCS on this server can allow the console by IP.
        ipv4_address: 172.30.10.10
    volumes:
      # Images uploaded in the website editor. The backup service copies them nightly.
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  # Database migrations and first-start settings, run by deploy/deploy.sh
  # before each release starts (no fixed address, so it can run beside the app).
  migrate:
    profiles: [tools]
    image: cloud-console:${RELEASE:-latest}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://console:${POSTGRES_PASSWORD}@db:5432/console
      NODE_ENV: production
    command: ["sh", "-c", "node /migrate/node_modules/prisma/build/index.js migrate deploy && node ops.cjs prestart"]
    networks: [console]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: console
      POSTGRES_DB: console
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    networks: [console]
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U console -d console"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The database and uploaded images, every night at BACKUP_AT (UTC): an
  # encrypted file in ./backups on the server, and a copy off-site when
  # OFFSITE_S3_BUCKET is set (any S3-compatible storage, e.g. Cloudflare R2).
  backup:
    image: cloud-console-backup:latest
    build:
      context: .
      dockerfile: deploy/backup.Dockerfile
    restart: unless-stopped
    command: ["/backup.sh", "--nightly"]
    networks: [console]
    environment:
      DATABASE_URL: postgresql://console:${POSTGRES_PASSWORD}@db:5432/console
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?set BACKUP_PASSPHRASE in .env}
      BACKUP_AT: ${BACKUP_AT:-23:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      OFFSITE_S3_BUCKET: ${OFFSITE_S3_BUCKET:-}
      OFFSITE_S3_PREFIX: ${OFFSITE_S3_PREFIX:-console}
      # rclone reads the off-site storage from these; nothing is written to disk.
      RCLONE_CONFIG_OFFSITE_TYPE: ${OFFSITE_TYPE:-s3}
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${OFFSITE_S3_PROVIDER:-Cloudflare}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${OFFSITE_S3_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${OFFSITE_S3_REGION:-auto}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${OFFSITE_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${OFFSITE_S3_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: "true"
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./deploy/restore-test.sh:/restore-test.sh:ro
      - media:/media:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

  caddy:
    profiles: [caddy]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    networks: [console]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

networks:
  console:
    ipam:
      config:
        - subnet: 172.30.10.0/24

volumes:
  db-data:
  media:
  caddy-data:
  caddy-config:

# Production: app, PostgreSQL and Caddy (automatic HTTPS).
#   cp .env.example .env, fill it in, then:
#   docker compose -f docker-compose.prod.yml up -d
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://console:${POSTGRES_PASSWORD}@db:5432/console
      NODE_ENV: production
    volumes:
      # Images uploaded in the website editor. The backup service copies them nightly.
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: console
      POSTGRES_DB: console
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U console -d console"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # The database and uploaded images, every night at BACKUP_AT (UTC), into
  # ./backups on the host. Copy that folder off the server as well.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["/backup.sh", "--nightly"]
    environment:
      DATABASE_URL: postgresql://console:${POSTGRES_PASSWORD}@db:5432/console
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?set BACKUP_PASSPHRASE in .env}
      BACKUP_AT: ${BACKUP_AT:-23:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - media:/media:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  media:
  caddy-data:
  caddy-config:
